services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: complaint_risk
      POSTGRES_USER: complaint_risk
      POSTGRES_PASSWORD: complaint_risk
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U complaint_risk -d complaint_risk"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - complaint-risk-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  complaint-risk-postgres:
