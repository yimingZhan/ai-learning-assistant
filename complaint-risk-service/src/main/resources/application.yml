spring:
  application:
    name: complaint-risk-service
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/complaint-risk;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

complaint-risk:
  scheduler-enabled: ${RISK_SCHEDULER_ENABLED:false}
  notification-enabled: ${RISK_NOTIFICATION_ENABLED:true}
  overlap-hours: 2
  safety-delay-minutes: 2
  page-size: 500
  yunk:
    mode: ${YUNK_MODE:mock}
    base-url: ${YUNK_BASE_URL:}
    token: ${YUNK_TOKEN:}
    messages-path: ${YUNK_MESSAGES_PATH:/openapi/v1/chat/messages}
  model:
    mode: ${MODEL_MODE:mock}
    base-url: ${MODEL_BASE_URL:}
    api-key: ${MODEL_API_KEY:}
    model: ${MODEL_NAME:gpt-4.1-mini}
    timeout-seconds: 30

logging:
  level:
    com.weixun.ai.complaint: INFO
