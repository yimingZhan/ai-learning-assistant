<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="单学生客诉预警 AI 回答呈现原型" />
    <title>学情护航台 · 客诉预警</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23221f1c'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='38' fill='%23f4efe6'%3E%E5%AD%A6%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <header class="masthead">
      <a class="brand" href="#" aria-label="返回学情护航台首页">
        <span class="brand-mark">学</span>
        <span><b>学情护航台</b><small>CASE SIGNAL / 01</small></span>
      </a>
      <div class="masthead-meta">
        <span class="live-dot"></span>
        <span>内部服务决策辅助</span>
        <time id="clock"></time>
      </div>
    </header>

    <main class="shell">
      <aside class="rail">
        <p class="rail-label">查询身份</p>
        <div class="role-switcher" id="role-switcher" role="tablist" aria-label="切换查询角色"></div>
        <div class="rail-note">
          <span>权限提示</span>
          <p id="permission-note">一线处置视图</p>
        </div>
        <nav class="student-list" aria-label="示例学生">
          <p class="rail-label">示例学生</p>
          <div id="student-list"></div>
        </nav>
      </aside>

      <section class="workspace">
        <form class="query-bar" id="query-form">
          <label for="student-select">问 AI</label>
          <div class="query-input-wrap">
            <span class="prompt-symbol">↳</span>
            <input id="query-input" value="张三最近有没有客诉风险？" aria-label="查询内容" />
          </div>
          <select id="student-select" aria-label="选择学生"></select>
          <button class="analyze-button" type="submit">重新分析</button>
        </form>

        <div id="report" aria-live="polite"></div>
      </section>
    </main>

    <dialog id="evidence-dialog" class="evidence-dialog">
      <button class="dialog-close" id="dialog-close" aria-label="关闭">×</button>
      <div id="dialog-content"></div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
